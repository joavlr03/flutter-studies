name: Merge study repositories
on:
  push:
    paths: ['.github/workflows/merge.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import repositories with full history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for r in Appiadas joken-pokemon-app pokemon-starter sorting_app iron-man-key viacepserviceapp easy_address_app quem_eh_esse_pokemon flutter_frete_testes ludoboardgames; do
            if [ -d "$r" ]; then echo "skip $r"; continue; fi
            b=$(git ls-remote --symref "https://github.com/joavlr03/$r.git" HEAD | awk '/^ref:/ {sub("refs/heads/","",$2); print $2}')
            git subtree add --prefix="$r" "https://github.com/joavlr03/$r.git" "$b" -m "Import $r with full history"
          done
          git push
